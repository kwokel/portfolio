---
layout: default
---
<article class="work-single">
  <header>
    <h1>{{ page.title }}</h1>
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
  </header>

  {% if page.coverImage %}
    <img class="cover" src="{{ page.coverImage | relative_url }}" alt="{{ page.title }}">
  {% endif %}

  <div class="content">
    {{ content }}
  </div>
</article>
