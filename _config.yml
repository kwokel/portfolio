title: "Karsten Wokel – Copywriting"
description: "Selected copywriting work and the thinking behind it"

# Projekt-Repo (kwokel.github.io/portfolio) -> baseurl nötig
url: "https://kwokel.github.io"
baseurl: "/portfolio"

collections:
  works:
    output: true

defaults:
  - scope:
      path: ""
      type: "works"
    values:
      layout: "work"
  - scope:
      path: ""
    values:
      layout: "default"

plugins:
  - jekyll-sitemap
  - jekyll-feed

markdown: kramdown

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - node_modules
