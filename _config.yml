# --- Grundeinstellungen ---
title: "Karsten Wokel – Copywriting"
description: "Ausgewählte Texte, Kampagnen und die Gedanken dahinter"

url: "https://kwokel.github.io"
baseurl: "/portfolio"

# --- Mehrsprachigkeit (jekyll-polyglot) ---
languages: ["de", "en"]
default_lang: "de"
exclude_from_localization: ["assets", "css", "images"]
parallel_localization: true
derive_lang_from_path: true

# --- Collection für die Arbeiten/Case Studies ---
collections:
  works:
    output: true
    permalink: /works/:name/

defaults:
  - scope:
      path: ""
      type: "works"
    values:
      layout: "work"
  - scope:
      path: ""
    values:
      layout: "default"

plugins:
  - jekyll-polyglot
  - jekyll-sitemap
  - jekyll-feed

markdown: kramdown

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - node_modules
