media:
  input: assets/images/works
  output: /assets/images/works

content:
  - name: works-de
    label: "Arbeiten (Deutsch)"
    type: collection
    path: _works/de
    view:
      fields: [title, date, coverImage]
    fields:
      - name: title
        label: "Titel"
        type: string
      - name: date
        label: "Datum"
        type: date
      - name: excerpt
        label: "Kurzbeschreibung"
        type: text
        description: "Wird in der Übersichtsliste angezeigt"
      - name: coverImage
        label: "Titelbild"
        type: image
      - name: lang
        label: "Sprache"
        type: string
        default: "de"
      - name: published
        label: "Veröffentlicht"
        type: boolean
        default: true
      - name: body
        label: "Inhalt"
        type: rich-text

  - name: works-en
    label: "Works (English)"
    type: collection
    path: _works/en
    view:
      fields: [title, date, coverImage]
    fields:
      - name: title
        label: "Title"
        type: string
      - name: date
        label: "Date"
        type: date
      - name: excerpt
        label: "Short description"
        type: text
        description: "Shown in the overview list"
      - name: coverImage
        label: "Cover image"
        type: image
      - name: lang
        label: "Language"
        type: string
        default: "en"
      - name: published
        label: "Published"
        type: boolean
        default: true
      - name: body
        label: "Content"
        type: rich-text

  - name: home-de
    label: "Startseite (Deutsch)"
    type: file
    path: index.md
    fields:
      - name: title
        type: string
      - name: body
        label: "Intro-Text"
        type: rich-text

  - name: home-en
    label: "Homepage (English)"
    type: file
    path: index-en.md
    fields:
      - name: title
        type: string
      - name: body
        label: "Intro text"
        type: rich-text

  - name: about-de
    label: "Über mich"
    type: file
    path: about.md
    fields:
      - name: title
        type: string
      - name: body
        type: rich-text

  - name: about-en
    label: "About"
    type: file
    path: about-en.md
    fields:
      - name: title
        type: string
      - name: body
        type: rich-text
